      <text x="734" y="698" fill="#F7F8F8" font-size="30" font-weight="700">Codex</text>
      <text x="734" y="729" fill="#8F9A95" font-size="17" font-weight="500">OpenAI</text>
      <rect x="734" y="752" width="216" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.045"/>
      <circle cx="754" cy="769" r="4" fill="#A8F0C4"/>
      <text x="768" y="775" fill="#C2CAC6" font-size="14" font-weight="700" letter-spacing="1.4">EXECUTION AGENT</text>

      <!-- Grok Build -->
      <g filter="url(#cardShadow)">
        <rect x="1090" y="636" width="420" height="190" rx="28" fill="#11161A" stroke="#72C7FF" stroke-opacity="0.28"/>
      </g>
      <rect x="1122" y="672" width="84" height="84" rx="24" fill="#72C7FF" fill-opacity="0.08" stroke="#72C7FF" stroke-opacity="0.22"/>
