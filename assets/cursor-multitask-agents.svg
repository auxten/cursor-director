      <circle cx="1254" cy="769" r="4" fill="#72C7FF"/>
      <text x="1268" y="775" fill="#C2CAC6" font-size="14" font-weight="700" letter-spacing="1.4">EXECUTION AGENT</text>
    </g>

    <!-- Footer statement -->
    <g font-family="'SF Pro Text','Helvetica Neue',Arial,sans-serif">
      <text x="800" y="864" text-anchor="middle" fill="#74817A" font-size="15" font-weight="650" letter-spacing="2.6">PARALLEL WORK  •  CENTRAL REVIEW  •  CONTINUOUS FLOW</text>
    </g>
  </g>
</svg>
