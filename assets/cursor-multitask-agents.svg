      </g>
      <text x="234" y="698" fill="#F7F8F8" font-size="30" font-weight="700">Claude Code</text>
      <text x="234" y="729" fill="#8F9A95" font-size="17" font-weight="500">Anthropic</text>
      <rect x="234" y="752" width="216" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.045"/>
      <circle cx="254" cy="769" r="4" fill="#D97757"/>
      <text x="268" y="775" fill="#C2CAC6" font-size="14" font-weight="700" letter-spacing="1.4">EXECUTION AGENT</text>

      <!-- Codex -->
      <g filter="url(#cardShadow)">
        <rect x="590" y="636" width="420" height="190" rx="28" fill="#11161A" stroke="#E8F3ED" stroke-opacity="0.19"/>
      </g>
      <rect x="622" y="672" width="84" height="84" rx="24" fill="#E8F3ED" fill-opacity="0.08" stroke="#E8F3ED" stroke-opacity="0.18"/>
