<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#080B0F"/>
      <stop offset="0.55" stop-color="#0B1014"/>
      <stop offset="1" stop-color="#07100C"/>
    </linearGradient>
    <radialGradient id="limeHalo" cx="0" cy="0" r="1" gradientTransform="translate(800 398) rotate(90) scale(470 760)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B7FF4A" stop-opacity="0.14"/>
      <stop offset="0.5" stop-color="#74F0A7" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#74F0A7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cursorStroke" x1="470" y1="220" x2="1130" y2="505" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D7FF63" stop-opacity="0.95"/>
      <stop offset="0.52" stop-color="#79F2B2" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#6CE6FF" stop-opacity="0.24"/>
    </linearGradient>
    <linearGradient id="connector" x1="800" y1="495" x2="800" y2="635" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C9FF64" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#7CF1B2" stop-opacity="0.35"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#DDF7E9" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <filter id="cardShadow" x="-15%" y="-25%" width="130%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 Z" fill="#8EF1AF"/>
    </marker>
    <clipPath id="frameClip">
      <rect width="1600" height="900" rx="0"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frameClip)">
    <rect width="1600" height="900" fill="url(#bg)"/>
    <rect width="1600" height="900" fill="url(#grid)"/>
    <rect width="1600" height="900" fill="url(#limeHalo)"/>
    <ellipse cx="800" cy="390" rx="390" ry="250" fill="#A7FF59" opacity="0.07" filter="url(#softGlow)"/>
    <circle cx="91" cy="68" r="2.5" fill="#C9FF64" opacity="0.8"/>
    <circle cx="1514" cy="165" r="2" fill="#79F2B2" opacity="0.58"/>
    <circle cx="1448" cy="812" r="2.5" fill="#6CE6FF" opacity="0.42"/>

    <!-- Header -->
    <g font-family="'SF Pro Display','SF Pro Text','Helvetica Neue',Arial,sans-serif">
      <rect x="88" y="70" width="196" height="38" rx="19" fill="#B9FF56" fill-opacity="0.10" stroke="#C7FF65" stroke-opacity="0.35"/>
      <circle cx="111" cy="89" r="5" fill="#C9FF64"/>
      <text x="128" y="95" fill="#D8FF90" font-size="17" font-weight="700" letter-spacing="2.2">AGENT STACK</text>
      <text x="88" y="172" fill="#F5F7F6" font-size="60" font-weight="750" letter-spacing="-1.8">CURSOR MULTITASK</text>
      <text x="88" y="213" fill="#9CA8A1" font-size="27" font-weight="450" letter-spacing="0.1">One main session. Three coding agents. Zero blocking.</text>

      <g transform="translate(1192 81)">
        <rect width="320" height="92" rx="24" fill="#0F1613" stroke="#DDF7E9" stroke-opacity="0.10"/>
        <circle cx="35" cy="31" r="6" fill="#85F2A9"/>
        <text x="55" y="38" fill="#E9F7EF" font-size="20" font-weight="650">MAIN SESSION</text>
        <text x="28" y="69" fill="#8EF1AF" font-size="17" font-weight="650" letter-spacing="1.2">ALWAYS NON-BLOCKING</text>
      </g>
    </g>

    <!-- Primary orchestrator card -->
    <g filter="url(#shadow)">
      <rect x="470" y="258" width="660" height="266" rx="36" fill="#111713" stroke="url(#cursorStroke)" stroke-width="2"/>
      <rect x="471" y="259" width="658" height="264" rx="35" fill="none" stroke="#FFFFFF" stroke-opacity="0.045"/>
    </g>
    <g font-family="'SF Pro Display','SF Pro Text','Helvetica Neue',Arial,sans-serif">
      <circle cx="604" cy="375" r="76" fill="#C6FF64" opacity="0.08" filter="url(#softGlow)"/>
      <rect x="538" y="309" width="132" height="132" rx="34" fill="#C9FF64"/>
      <!-- Cursor official 2D cube mark -->
      <g transform="translate(571 327) scale(0.141)" fill="#10140F">
        <path d="M457.43,125.94L244.42,2.96c-6.84-3.95-15.28-3.95-22.12,0L9.3,125.94c-5.75,3.32-9.3,9.46-9.3,16.11v247.99c0,6.65,3.55,12.79,9.3,16.11l213.01,122.98c6.84,3.95,15.28,3.95,22.12,0l213.01-122.98c5.75-3.32,9.3-9.46,9.3-16.11v-247.99c0-6.65-3.55-12.79-9.3-16.11h-.01ZM444.05,151.99l-205.63,356.16c-1.39,2.4-5.06,1.42-5.06-1.36v-233.21c0-4.66-2.49-8.97-6.53-11.31L24.87,145.67c-2.4-1.39-1.42-5.06,1.36-5.06h411.26c5.84,0,9.49,6.33,6.57,11.39h-.01Z"/>
      </g>
      <text x="718" y="338" fill="#A8B4AD" font-size="17" font-weight="700" letter-spacing="2.8">ORCHESTRATOR</text>
      <text x="714" y="389" fill="#F7FAF8" font-size="43" font-weight="740" letter-spacing="-0.7">Cursor</text>
      <text x="716" y="425" fill="#98A59E" font-size="21" font-weight="450">Understands the task, routes the work,</text>
      <text x="716" y="454" fill="#98A59E" font-size="21" font-weight="450">then reviews the result.</text>

      <g transform="translate(538 474)">
        <rect width="554" height="34" rx="17" fill="#C9FF64" fill-opacity="0.07"/>
        <text x="28" y="23" fill="#D6FF8B" font-size="15" font-weight="700" letter-spacing="2">ORCHESTRATE</text>
        <circle cx="164" cy="17" r="2.5" fill="#6D7A72"/>
        <text x="186" y="23" fill="#D6FF8B" font-size="15" font-weight="700" letter-spacing="2">DELEGATE</text>
        <circle cx="302" cy="17" r="2.5" fill="#6D7A72"/>
        <text x="324" y="23" fill="#D6FF8B" font-size="15" font-weight="700" letter-spacing="2">REVIEW</text>
        <circle cx="431" cy="17" r="2.5" fill="#6D7A72"/>
        <text x="453" y="23" fill="#D6FF8B" font-size="15" font-weight="700" letter-spacing="2">REPEAT</text>
      </g>
    </g>

    <!-- Dynamic routing connectors -->
    <g fill="none" stroke="url(#connector)" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M720 524 C 678 568, 493 562, 330 626"/>
      <path d="M800 524 C 800 563, 800 583, 800 626"/>
      <path d="M880 524 C 922 568, 1107 562, 1270 626"/>
    </g>
    <g font-family="'SF Pro Text','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="1.5" fill="#8EF1AF">
      <rect x="671" y="542" width="258" height="30" rx="15" fill="#0D1711" stroke="#8EF1AF" stroke-opacity="0.18"/>
      <text x="696" y="562">DYNAMIC CAPABILITY ROUTING</text>
    </g>

    <!-- Agent cards -->
    <g font-family="'SF Pro Display','SF Pro Text','Helvetica Neue',Arial,sans-serif">
      <!-- Claude Code -->
      <g filter="url(#cardShadow)">
        <rect x="90" y="636" width="420" height="190" rx="28" fill="#11161A" stroke="#D97757" stroke-opacity="0.33"/>
      </g>
      <rect x="122" y="672" width="84" height="84" rx="24" fill="#D97757" fill-opacity="0.11" stroke="#D97757" stroke-opacity="0.25"/>
      <g transform="translate(140 690) scale(2)" fill="#D97757">
